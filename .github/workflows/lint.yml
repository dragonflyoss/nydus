name: Lint

on:
  push:
    branches: [main, release-*, v3]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
  pull_request:
    branches: [main, release-*, v3]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    name: lint / workspace / rust-go
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          toolchain: 1.88.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GH_TOKEN }}

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: |
          cargo clippy --all --all-targets --all-features -- -D warnings

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache-dependency-path: |
            nydusify/go.sum
            tests/e2e/go.sum

      - name: Lint nydusify
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7
          working-directory: nydusify

      - name: Lint E2E
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7
          working-directory: tests/e2e

      # Layout rules (one test per file, t.Parallel, no t.Skip), the
      # harness's own unprivileged tests, and the build-tagged manual
      # suites, which golangci-lint does not compile.
      - name: Check
        working-directory: tests/e2e
        run: |
          go test -count=1 ./internal/...
          go vet -tags manual ./manual/...
          go build -o /dev/null ./cmd/golden-gen

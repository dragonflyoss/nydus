name: E2E Test With Experimental Transports

on:
  push:
    branches: [master, release-*, v3]
    paths-ignore: ['**.md', '**.png', '**.jpg', '**.svg', '**/docs/**']
  pull_request:
    branches: [master, release-*, v3]
    paths-ignore: ['**.md', '**.png', '**.jpg', '**.svg', '**/docs/**']
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  FEATURES: cli,fuse,fileio,nbd,ublk,fanotify,uffd

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: llvm-tools-preview

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: nydusify/go.mod
          cache-dependency-path: nydusify/go.sum

      - name: Build binaries
        run: make build-coverage FEATURES="$FEATURES"

      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: e2e-experimental-binaries
          path: |
            target/ci/nydus
            target/ci/examples/writer-fixture
            nydusify/nydusify
            coverage-tools/
          if-no-files-found: error
          retention-days: 3

  test:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        transport: ['nbd', 'fanotify', 'uffd', 'ublk']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tests/e2e/go.mod
          cache-dependency-path: tests/e2e/go.sum

      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          name: e2e-experimental-binaries

      - name: Install dependencies
        run: |
          chmod +x target/ci/nydus nydusify/nydusify
          packages=(erofs-utils fuse3 strace udev)
          if [ "${{ matrix.transport }}" = ublk ] && ! modinfo ublk_drv >/dev/null 2>&1; then
            packages+=("linux-modules-extra-$(uname -r)")
          fi
          bash tests/scripts/install_ci_packages.sh "${packages[@]}"
          sudo modprobe fuse
          if [ "${{ matrix.transport }}" = nbd ]; then sudo modprobe nbd; fi
          if [ "${{ matrix.transport }}" = ublk ]; then sudo modprobe ublk_drv; fi

      - name: Run E2E test
        run: make e2e-run PKG=./experimental/${{ matrix.transport }}/... E2E_TIMEOUT=4m E2E_PARALLEL=${{ matrix.transport == 'ublk' && 2 || 8 }}

      - name: Run UFFD stability test
        if: ${{ matrix.transport == 'uffd' && github.event_name == 'schedule' }}
        run: |
          make e2e-run PKG=./experimental/uffd/... E2E_TIMEOUT=3m \
            E2E_RUN='^TestRealFault(Copy|Zeropage|Zerocopy)$$' E2E_COUNT=34

      - name: Export coverage
        run: bash tests/scripts/e2e_coverage.sh export

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        timeout-minutes: 1
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/rust-e2e.lcov
          flags: e2etests
          disable_search: true

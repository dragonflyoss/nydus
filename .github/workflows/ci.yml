name: CI

on:
  push:
    branches: [main, release-*, v3]
    paths-ignore: ['**.md', '**.png', '**.jpg', '**.svg', '**/docs/**']
  pull_request:
    branches: [main, release-*, v3]
    paths-ignore: ['**.md', '**.png', '**.jpg', '**.svg', '**/docs/**']

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0
  NYDUS_TEST_FAIL_KNOWN_ISSUES: '1'
  CI_COVERAGE: '1'

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      NYDUS_TEST_REQUIRE_NETNS: '1'
      NYDUS_TEST_REQUIRE_PTRACE: '1'
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo -E
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install dependencies
        run: bash tests/scripts/install_ci_packages.sh iproute2

      - name: Run tests
        id: rust-tests
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --no-fail-fast \
            --features 'nydus/cli,nydus/fileio,nydus/dragonfly,nydus/nbd,nydus/ublk,nydus/fanotify,nydus/uffd,nydus-test-utils/fault-backend' \
            --no-report

      - name: Run dual TLS tests
        id: dual-tls
        if: ${{ !cancelled() && steps.rust-tests.outcome != 'skipped' }}
        run: |
          cargo llvm-cov --no-report -p nydus-backend --features registry,reqwest/default-tls --lib -- \
            registry::http::tests::tls_verification_and_custom_ca_are_preserved

      - name: Export coverage
        if: ${{ !cancelled() }}
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() && hashFiles('lcov.info') != '' }}
        timeout-minutes: 1
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: unittests
          disable_search: true
          fail_ci_if_error: false

  test-nydusify:
    name: Test Nydusify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: nydusify

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: nydusify/go.mod
          cache-dependency-path: nydusify/go.sum

      - name: Build binaries
        run: |
          make ci-build nydusify FEATURES=cli
          bash tests/scripts/e2e_coverage.sh bundle

      - name: Run tests
        id: suites
        run: make test-nydusify NYDUS_TEST_BUILDER="$GITHUB_WORKSPACE/target/ci/nydus"

      - name: Export coverage
        if: always()
        env:
          COVERAGE_TEST_OUTCOME: ${{ steps.suites.outcome }}
        run: bash tests/scripts/e2e_coverage.sh export

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() && hashFiles('coverage/go-unit-integration.out') != '' }}
        timeout-minutes: 1
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/go-unit-integration.out,coverage/rust-e2e.lcov
          flags: unittests
          disable_search: true
          fail_ci_if_error: false

  test-harness:
    name: Test Harness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tests/e2e/go.mod
          cache-dependency-path: tests/e2e/go.sum

      - name: Run tests
        working-directory: tests/e2e
        run: go test -count=1 ./internal/...

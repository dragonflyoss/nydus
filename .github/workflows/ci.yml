name: CI

on:
  push:
    branches: [main, release-*, v3]
    paths-ignore: ['**.md', '**.png', '**.jpg', '**.svg', '**/docs/**']
  pull_request:
    branches: [main, release-*, v3]
    paths-ignore: ['**.md', '**.png', '**.jpg', '**.svg', '**/docs/**']
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo -E
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.88.0
          components: llvm-tools-preview

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ github.token }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2

      - name: Run tests
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --no-fail-fast \
            --features 'nydus/cli,nydus/fileio,nydus/dragonfly,nydus/nbd,nydus/ublk,nydus/fanotify,nydus/uffd,nydus-test-utils/fault-backend' \
            --no-report -- --include-ignored

      - name: Run dual TLS tests
        run: |
          cargo llvm-cov --no-report -p nydus-backend --features registry,reqwest/default-tls --lib -- \
            registry::transport::http::tests::new_trusts_the_ca_cert_or_skips_verification

      - name: Export coverage
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        timeout-minutes: 1
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: unittests
          disable_search: true

  test-nydusify:
    name: Test Nydusify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COVERAGE: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.88.0
          components: llvm-tools-preview

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: nydusify/go.mod
          cache-dependency-path: nydusify/go.sum

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov

      - name: Build binaries
        run: make build-coverage FEATURES=cli

      - name: Run tests
        run: make test-nydusify

      - name: Export coverage
        run: make coverage-report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        timeout-minutes: 1
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/go-unit-integration.out,coverage/rust-e2e.lcov
          flags: unittests
          disable_search: true

name: Coverage report

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: coverage-report-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  report:
    name: report / coverage / summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Privileged reporting must never check out or execute the PR's code.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Merge reports and update PR comment
        id: summary
        env:
          GH_TOKEN: ${{ github.token }}
          COVERAGE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 tests/scripts/coverage_comment.py
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary/
          if-no-files-found: ignore
      - uses: codecov/codecov-action@v5
        if: ${{ hashFiles('coverage-summary/rust.lcov') != '' }}
        timeout-minutes: 1
        continue-on-error: true
        with:
          files: coverage-summary/rust.lcov
          flags: rust_combined
          disable_search: true
          fail_ci_if_error: false
          override_commit: ${{ github.event.workflow_run.head_sha }}
          override_branch: ${{ github.event.workflow_run.head_branch }}
          override_pr: ${{ steps.summary.outputs.pr }}
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: codecov/codecov-action@v5
        if: ${{ hashFiles('coverage-summary/go.out') != '' }}
        timeout-minutes: 1
        continue-on-error: true
        with:
          files: coverage-summary/go.out
          flags: go_combined
          disable_search: true
          fail_ci_if_error: false
          override_commit: ${{ github.event.workflow_run.head_sha }}
          override_branch: ${{ github.event.workflow_run.head_branch }}
          override_pr: ${{ steps.summary.outputs.pr }}
          token: ${{ secrets.CODECOV_TOKEN }}

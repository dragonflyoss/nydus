name: Benchmark

on:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tests/e2e/go.mod
          cache-dependency-path: |
            nydusify/go.sum
            tests/e2e/go.sum

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils erofsfuse fuse3 fio
          sudo modprobe fuse

      - name: Run benchmark
        run: make benchmark BENCH='Mount/^(fuse|fileio)$$' E2E_COUNT=6 | tee bench.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v6
        with:
          name: bench
          path: bench.txt

name: Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0
  FEATURES: cli,fuse,fileio
  NYDUS_TEST_FAIL_KNOWN_ISSUES: '1'

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: benchmark

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tests/e2e/go.mod
          cache-dependency-path: |
            nydusify/go.sum
            tests/e2e/go.sum

      - name: Install dependencies
        run: |
          bash tests/scripts/install_ci_packages.sh erofs-utils fuse3 fio
          sudo modprobe fuse

      - name: Install erofsfuse
        run: sudo bash tests/scripts/setup_erofsfuse.sh

      - name: Build binaries
        run: make ci-build nydusify FEATURES="$FEATURES"

      - name: Run benchmark
        env:
          NYDUSFS_BENCH_MODES: fuse,fileio
          NYDUSFS_BENCH_OUTPUT: ${{ github.workspace }}/bench-results.json
        run: make e2e-run PKG=./manual/bench/ E2E_TAGS=manual E2E_REQUIRE=1 E2E_TIMEOUT=60m E2E_GO_TEST_ARGS=-v

      - name: Upload benchmark results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bench-results
          path: bench-results.json
          if-no-files-found: warn

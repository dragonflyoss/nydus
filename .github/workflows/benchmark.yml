name: Benchmark

on:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.88.0

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: tests/e2e/go.mod
          cache-dependency-path: |
            nydusify/go.sum
            tests/e2e/go.sum

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils erofsfuse fuse3 fio
          sudo modprobe fuse

      - name: Run benchmark
        run: make benchmark BENCH='Mount/^(fuse|fileio)$$' E2E_COUNT=6 | tee bench.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bench
          path: bench.txt

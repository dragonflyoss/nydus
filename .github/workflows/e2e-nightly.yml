name: Nightly E2E Test

on:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1

jobs:
  soak:
    name: Soak
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      COVERAGE: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.88.0
          components: llvm-tools-preview

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          shared-key: e2e-nightly

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: tests/e2e/go.mod
          cache-dependency-path: |
            nydusify/go.sum
            tests/e2e/go.sum

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y acl attr erofs-utils fuse3
          sudo modprobe fuse
          sudo modprobe erofs

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov

      - name: Build binaries
        run: make build-coverage FEATURES=cli,fuse,fileio

      - name: Run E2E test
        run: make e2e-soak E2E_PARALLEL=4

      - name: Export coverage
        run: make coverage-report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        timeout-minutes: 1
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/rust-e2e.lcov
          flags: e2etests
          disable_search: true

  hugetar:
    name: Huge Tar
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.88.0

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          shared-key: e2e-nightly

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: tests/e2e/go.mod
          cache-dependency-path: |
            nydusify/go.sum
            tests/e2e/go.sum

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils fuse3
          sudo modprobe fuse

      - name: Run E2E test
        run: make e2e-hugetar

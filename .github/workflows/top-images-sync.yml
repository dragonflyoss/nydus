name: Sync Top Images to GHCR
run-name: "Sync Top Images to GHCR (${{ inputs.images || 'all images' }})"

on:
  workflow_dispatch:
    inputs:
      images:
        description: "Space-separated subset of images to copy (default: all images in the list)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  list:
    name: Build image list
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build image list
        id: list
        env:
          IMAGES_OVERRIDE: ${{ inputs.images }}
        run: |
          if [ -n "$IMAGES_OVERRIDE" ]; then
            images="$IMAGES_OVERRIDE"
          else
            images=$(sed -e 's/#.*$//' -e 's/[[:space:]]//g' -e '/^$/d' \
                         -e "s|^ghcr\.io/[^/]*/[^/]*/||" -e 's/:[^:]*$//' \
                         tests/e2e/corpus/top-images.txt)
          fi
          echo "images=$(printf '%s\n' $images | jq -cRn '[inputs | select(length > 0)]')" >> "$GITHUB_OUTPUT"

  sync:
    name: ${{ matrix.image }}
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        image: ${{ fromJSON(needs.list.outputs.images) }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy image to GHCR
        env:
          IMAGE: ${{ matrix.image }}
          GHCR_NAMESPACE: ghcr.io/${{ github.repository }}
        run: |
          src="docker://docker.io/library/${IMAGE}:latest"
          dst="docker://${GHCR_NAMESPACE}/${IMAGE}:latest"
          wait=60
          while :; do
            status=0
            out=$(skopeo copy --all --retry-times 3 "$src" "$dst" 2>&1) || status=$?
            echo "$out"
            if [ $status -eq 0 ]; then
              exit 0
            fi
            if printf '%s\n' "$out" | grep -qiE 'manifest unknown|name unknown|not found|404'; then
              echo "::warning::${IMAGE} not found on Docker Hub; skipped."
              exit 0
            fi
            if printf '%s\n' "$out" | grep -qiE 'toomanyrequests|too many requests|429'; then
              echo "Rate limited pulling ${IMAGE}; retrying in ${wait}s."
              sleep "$wait"
              wait=$((wait * 2))
              if [ $wait -gt 900 ]; then
                wait=900
              fi
              continue
            fi
            exit $status
          done

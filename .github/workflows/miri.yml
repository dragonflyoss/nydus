name: Miri Test

on:
  push:
    branches: ["**", "stable/**"]
    paths-ignore: [ '**.md', '**.png', '**.jpg', '**.svg', '**/docs/**' ]
  pull_request:
    branches: ["**", "stable/**"]
    paths-ignore: [ '**.md', '**.png', '**.jpg', '**.svg', '**/docs/**' ]
  schedule:
    # Run daily sanity check at 03:00 clock UTC
    - cron: "0 03 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  nydus-unit-test-with-miri:
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-latest' }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        shared-key: Linux-cargo-amd64
        save-if: ${{ github.ref == 'refs/heads/master' }}
    - name: Install cargo nextest
      uses: taiki-e/install-action@nextest
    - name: Fscache Setup
      run: sudo bash misc/fscache/setup.sh
    - name: Install Miri
      run: |
        rustup toolchain install nightly --component miri
        rustup override set nightly
        cargo miri setup
    - name: Install protoc
      run: bash misc/install-protoc.sh
    - name: Unit Test with Miri
      run: |
        # Two bugs made this step unable to fail: `tee` swallowed miri's exit status, and
        # `grep 'Undefined Behavior'` succeeds when it *finds* UB, so a run reporting UB passed.
        set -o pipefail
        CARGO_HOME=${HOME}/.cargo
        CARGO_BIN=$(which cargo)
        RUSTUP_BIN=$(which rustup)
        sudo -E RUSTUP=${RUSTUP_BIN} make miri-ut-nextest 2>&1 | tee miri-ut.log
        if grep -q 'error: Undefined Behavior' miri-ut.log; then
          echo "::error::Miri reported undefined behavior; see the log above."
          exit 1
        fi

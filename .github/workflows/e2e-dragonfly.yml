name: E2E Test With Dragonfly

on:
  push:
    branches: [main, release-*, v3]
    paths-ignore: ['**.md', '**.png', '**.jpg', '**.svg', '**/docs/**']
  pull_request:
    branches: [main, release-*, v3]
    paths-ignore: ['**.md', '**.png', '**.jpg', '**.svg', '**/docs/**']
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0
  FEATURES: cli,fuse,fileio,dragonfly
  KIND_VERSION: v0.32.0
  KIND_CONFIG_PATH: tests/testdata/kind/config.yaml
  DRAGONFLY_CHART_VERSION: '1.8.2'
  DRAGONFLY_CHARTS_CONFIG_PATH: tests/testdata/charts/config.yaml
  DRAGONFLY_SCHEDULER_NODEPORT_SERVICE_PATH: tests/testdata/k8s/scheduler-nodeport-svc.yaml
  NYDUS_TEST_FAIL_KNOWN_ISSUES: '1'
  CI_COVERAGE: '1'

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create kind network
        run: docker network create kind --subnet 172.30.0.0/16 --gateway 172.30.0.1

      - name: Setup Kind
        uses: helm/kind-action@v1
        with:
          version: ${{ env.KIND_VERSION }}
          config: ${{ env.KIND_CONFIG_PATH }}
          cluster_name: kind

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: e2e-ci

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tests/e2e/go.mod
          cache-dependency-path: |
            nydusify/go.sum
            tests/e2e/go.sum

      - name: Install dependencies
        run: |
          bash tests/scripts/install_ci_packages.sh fuse3
          sudo modprobe fuse

      - name: Build binaries
        run: |
          make ci-build nydusify FEATURES="$FEATURES"
          bash tests/scripts/e2e_coverage.sh bundle

      - name: Setup dragonfly
        run: |
          helm repo add dragonfly https://dragonflyoss.github.io/helm-charts/
          helm install --wait --timeout 3m --create-namespace --namespace dragonfly-system \
            --version "${DRAGONFLY_CHART_VERSION}" -f "${DRAGONFLY_CHARTS_CONFIG_PATH}" \
            dragonfly dragonfly/dragonfly
          kubectl apply -f "${DRAGONFLY_SCHEDULER_NODEPORT_SERVICE_PATH}"
          timeout 120 bash -c 'until (echo > /dev/tcp/127.0.0.1/8002) 2>/dev/null; do sleep 1; done'

      - name: Setup registry
        run: |
          docker run -d --name registry -p 5000:5000 registry:2
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:5000/v2/ >/dev/null; do sleep 1; done'

      - name: Run E2E test
        id: suites
        env:
          NYDUS_E2E_DRAGONFLY_SCHEDULER: http://127.0.0.1:8002
        run: |
          export KUBECONFIG="$HOME/.kube/config"
          make e2e-run PKG=./dragonfly/... E2E_REQUIRE=1 E2E_TIMEOUT=4m E2E_GO_TEST_ARGS=-v

      - name: Export coverage
        if: always()
        env:
          COVERAGE_TEST_OUTCOME: ${{ steps.suites.outcome }}
        run: bash tests/scripts/e2e_coverage.sh export

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() && hashFiles('coverage/rust-e2e.lcov') != '' }}
        timeout-minutes: 1
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/rust-e2e.lcov
          flags: e2etests
          disable_search: true
          fail_ci_if_error: false

      - name: Export logs
        if: always()
        run: |
          mkdir -p /tmp/artifact
          kubectl --namespace dragonfly-system get pods -o wide > /tmp/artifact/pods.log 2>&1 || true
          kubectl --namespace dragonfly-system get services > /tmp/artifact/services.log 2>&1 || true
          kubectl --namespace dragonfly-system logs statefulset/dragonfly-scheduler --tail=-1 > /tmp/artifact/scheduler.log 2>&1 || true
          kubectl --namespace dragonfly-system logs statefulset/dragonfly-seed-client --tail=-1 > /tmp/artifact/seed-client.log 2>&1 || true

      - name: Upload Logs
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dragonfly-e2e-tests-logs
          path: /tmp/artifact
          if-no-files-found: ignore

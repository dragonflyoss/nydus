name: E2E Test With Dragonfly

on:
  push:
    branches: [main, release-*, v3]
    paths-ignore: ['**.md', '**.png', '**.jpg', '**.svg', '**/docs/**']
  pull_request:
    branches: [main, release-*, v3]
    paths-ignore: ['**.md', '**.png', '**.jpg', '**.svg', '**/docs/**']
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  KIND_VERSION: v0.32.0
  KIND_CONFIG_PATH: tests/testdata/kind/config.yaml
  DRAGONFLY_CHART_VERSION: "1.8.2"
  DRAGONFLY_CHARTS_CONFIG_PATH: tests/testdata/charts/config.yaml
  DRAGONFLY_SCHEDULER_NODEPORT_SERVICE_PATH: tests/testdata/k8s/scheduler-nodeport-svc.yaml

jobs:
  build:
    name: Build nydus and nydusify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GH_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build nydus
        run: cargo build -p nydus --release --features "cli,dragonfly"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: nydusify/go.mod

      - name: Build nydusify
        run: |
          cd nydusify
          go build -o ../target/release/nydusify .

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: nydus-artifact
          path: |
            target/release/nydus
            target/release/nydusify

  e2e_tests:
    name: E2E (${{ matrix.mode }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: ['seed-peer', 'origin']
        include:
          - mode: seed-peer
            run: '^TestDragonfly_(ReadThroughSeedPeer|ServedFromSeedPeerCache|Prefetch|PrefetchRetry|ProxyError)$'
          - mode: origin
            run: '^TestDragonfly_(FallbackToOrigin|BackToSourceRateLimit|OriginErrorWithoutSeedPeers)$'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: nydus-artifact
          path: /tmp/nydus-bin

      - name: Install binaries
        run: |
          sudo install -m 0755 /tmp/nydus-bin/nydus /usr/local/bin/nydus
          sudo install -m 0755 /tmp/nydus-bin/nydusify /usr/local/bin/nydusify
          sudo apt-get update -qq
          sudo apt-get install -y -qq fuse3
          mkdir -p /tmp/artifact

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tests/e2e/go.mod

      - name: Create kind network
        run: docker network create kind --subnet 172.30.0.0/16 --gateway 172.30.0.1

      - name: Setup Kind
        uses: helm/kind-action@v1
        with:
          version: ${{ env.KIND_VERSION }}
          config: ${{ env.KIND_CONFIG_PATH }}
          cluster_name: kind

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup dragonfly
        run: |
          helm repo add dragonfly https://dragonflyoss.github.io/helm-charts/
          helm install --wait --timeout 10m --create-namespace --namespace dragonfly-system \
            --version ${{ env.DRAGONFLY_CHART_VERSION }} -f ${{ env.DRAGONFLY_CHARTS_CONFIG_PATH }} \
            dragonfly dragonfly/dragonfly
          kubectl apply -f ${{ env.DRAGONFLY_SCHEDULER_NODEPORT_SERVICE_PATH }}
          timeout 120 bash -c 'until (echo > /dev/tcp/127.0.0.1/8002) 2>/dev/null; do sleep 1; done'

      - name: Setup registry
        run: |
          docker run -d --name registry -p 5000:5000 registry:2
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:5000/v2/ >/dev/null; do sleep 1; done'

      - name: Run E2E test
        run: |
          cd tests/e2e
          sudo -E env "PATH=$PATH" KUBECONFIG="$HOME/.kube/config" NYDUS_E2E_ARTIFACT_DIR=/tmp/artifact \
            go test -v -count=1 -timeout 30m -run '${{ matrix.run }}' .

      - name: Export logs
        if: always()
        run: |
          kubectl --namespace dragonfly-system get pods -o wide > /tmp/artifact/pods.log 2>&1 || true
          kubectl --namespace dragonfly-system get services > /tmp/artifact/services.log 2>&1 || true
          kubectl --namespace dragonfly-system logs statefulset/dragonfly-scheduler --tail=-1 > /tmp/artifact/scheduler.log 2>&1 || true
          kubectl --namespace dragonfly-system logs statefulset/dragonfly-seed-client --tail=-1 > /tmp/artifact/seed-client.log 2>&1 || true
          sudo chown -R $USER:$USER /tmp/artifact

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dragonfly-${{ matrix.mode }}-e2e-tests-logs
          path: /tmp/artifact/**

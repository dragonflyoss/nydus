name: E2E Test With Dragonfly

on:
  push:
    branches: [main, release-*, v3]
    paths-ignore: ['**.md', '**.png', '**.jpg', '**.svg', '**/docs/**']
  pull_request:
    branches: [main, release-*, v3]
    paths-ignore: ['**.md', '**.png', '**.jpg', '**.svg', '**/docs/**']
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  KIND_VERSION: v0.32.0
  KIND_CONFIG_PATH: tests/testdata/kind/config.yaml
  DRAGONFLY_CHART_VERSION: 1.8.2
  DRAGONFLY_CHARTS_CONFIG_PATH: tests/testdata/charts/config.yaml
  DRAGONFLY_SCHEDULER_NODEPORT_SERVICE_PATH: tests/testdata/k8s/scheduler-nodeport-svc.yaml

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COVERAGE: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Create Kind network
        run: docker network create kind --subnet 172.30.0.0/16 --gateway 172.30.0.1

      - name: Setup Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: ${{ env.KIND_VERSION }}
          config: ${{ env.KIND_CONFIG_PATH }}
          cluster_name: kind

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.88.0
          components: llvm-tools-preview

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          shared-key: e2e-ci

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ github.token }}

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: tests/e2e/go.mod
          cache-dependency-path: |
            nydusify/go.sum
            tests/e2e/go.sum

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          sudo modprobe fuse

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov

      - name: Build binaries
        run: make build-coverage

      - name: Setup Dragonfly
        run: |
          helm repo add dragonfly https://dragonflyoss.github.io/helm-charts/
          helm install --wait --timeout 3m --create-namespace --namespace dragonfly-system \
            --version "${DRAGONFLY_CHART_VERSION}" -f "${DRAGONFLY_CHARTS_CONFIG_PATH}" \
            dragonfly dragonfly/dragonfly
          kubectl apply -f "${DRAGONFLY_SCHEDULER_NODEPORT_SERVICE_PATH}"
          timeout 120 bash -c 'until (echo > /dev/tcp/127.0.0.1/8002) 2>/dev/null; do sleep 1; done'

      - name: Setup registry
        run: |
          docker run -d --name registry -p 5000:5000 registry:2
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:5000/v2/ >/dev/null; do sleep 1; done'

      - name: Run E2E test
        env:
          NYDUS_E2E_DRAGONFLY_SCHEDULER: http://127.0.0.1:8002
        run: |
          export KUBECONFIG="$HOME/.kube/config"
          make e2e-run PKG=./dragonfly/... E2E_TIMEOUT=15m

      - name: Export coverage
        run: make coverage-report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        timeout-minutes: 1
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/rust-e2e.lcov
          flags: e2etests
          disable_search: true

      - name: Export logs
        if: always()
        run: |
          mkdir -p /tmp/artifact
          kubectl --namespace dragonfly-system get pods -o wide > /tmp/artifact/pods.log 2>&1 || true
          kubectl --namespace dragonfly-system get services > /tmp/artifact/services.log 2>&1 || true
          kubectl --namespace dragonfly-system logs statefulset/dragonfly-scheduler --tail=-1 > /tmp/artifact/scheduler.log 2>&1 || true
          kubectl --namespace dragonfly-system logs statefulset/dragonfly-seed-client --tail=-1 > /tmp/artifact/seed-client.log 2>&1 || true

      - name: Upload logs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: dragonfly-e2e-tests-logs
          path: /tmp/artifact
          if-no-files-found: ignore

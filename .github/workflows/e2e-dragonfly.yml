name: E2E Test With Dragonfly

on:
  push:
    branches: [main, release-*, v3]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
  pull_request:
    branches: [main, release-*, v3]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  DRAGONFLY_CHART_VERSION: "1.8.2"

jobs:
  build:
    name: Build nydus and nydusify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GH_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build nydus
        run: cargo build -p nydus --release --features "cli,backend-dragonfly-proxy"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Build nydusify
        run: |
          cd nydusify
          go build -o ../target/release/nydusify .

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: nydus-artifact
          path: |
            target/release/nydus
            target/release/nydusify

  e2e:
    name: E2E (${{ matrix.mode }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: fallback
            config: nydus-fallback.yaml
            test: TestDragonflyE2E
          - mode: strict
            config: nydus-strict.yaml
            test: TestDragonflyE2E
          - mode: proxy-error
            config: nydus-proxy-error.yaml
            test: TestProxyErrorSimulation
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: nydus-artifact
          path: /tmp/nydus-bin

      - name: Install binaries
        run: |
          sudo install -m 0755 /tmp/nydus-bin/nydus /usr/local/bin/nydus
          sudo install -m 0755 /tmp/nydus-bin/nydusify /usr/local/bin/nydusify

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Install runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fuse3

      - name: Create kind network
        run: docker network create kind --subnet 172.30.0.0/16 --gateway 172.30.0.1

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          config: tests/e2e/testdata/dragonfly/kind.yaml

      - name: Install Dragonfly
        run: |
          helm repo add dragonfly https://dragonflyoss.github.io/helm-charts/
          helm install dragonfly dragonfly/dragonfly \
            --version "${DRAGONFLY_CHART_VERSION}" \
            --namespace dragonfly-system --create-namespace \
            --values tests/e2e/testdata/dragonfly/values.yaml \
            --wait --timeout 10m
          timeout 120 bash -c 'until (echo > /dev/tcp/127.0.0.1/8002) 2>/dev/null; do sleep 1; done'

      - name: Push nydus test image
        run: |
          docker run -d --name registry -p 5000:5000 registry:2
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:5000/v2/ >/dev/null; do sleep 1; done'

          WORK_DIR="/tmp/nydus-dragonfly"
          mkdir -p "${WORK_DIR}/source/etc" "${WORK_DIR}/source/data" "${WORK_DIR}/mnt" "${WORK_DIR}/cache"
          printf 'NAME="Nydus Dragonfly E2E"\nID=nydus-e2e\nVERSION_ID=1\n' > "${WORK_DIR}/source/etc/os-release"
          echo "root:x:0:0:root:/root:/bin/sh" > "${WORK_DIR}/source/etc/passwd"
          echo "root:x:0:" > "${WORK_DIR}/source/etc/group"
          head -c 4194304 /dev/urandom > "${WORK_DIR}/source/data/blob1.bin"
          head -c 8388608 /dev/urandom > "${WORK_DIR}/source/data/blob2.bin"

          nydusify convert --source "${WORK_DIR}/source" \
            --target 172.30.0.1:5000/nydus-e2e/dragonfly:v1 \
            --builder /usr/local/bin/nydus \
            --target-insecure --target-plain-http
          nydusify check --target 172.30.0.1:5000/nydus-e2e/dragonfly:v1 \
            --work-dir "${WORK_DIR}/check" \
            --builder /usr/local/bin/nydus \
            --target-insecure --target-plain-http

          BOOTSTRAP_FILE=$(find "${WORK_DIR}/check" -name image.boot | head -1)
          [ -n "${BOOTSTRAP_FILE}" ] || { echo "exported image.boot not found under ${WORK_DIR}/check"; exit 1; }
          cp "${BOOTSTRAP_FILE}" "${WORK_DIR}/bootstrap"

      - name: Run e2e test (${{ matrix.mode }})
        run: |
          cd tests/e2e
          sudo -E env "PATH=$PATH" \
            KUBECONFIG="$HOME/.kube/config" \
            NYDUS_BIN=/usr/local/bin/nydus \
            NYDUS_CONFIG=${{ github.workspace }}/tests/e2e/testdata/dragonfly/${{ matrix.config }} \
            DRAGONFLY_MODE=${{ matrix.mode }} \
            DRAGONFLY_STOP_CMD="kubectl --namespace dragonfly-system scale statefulset --all --replicas=0 && kubectl --namespace dragonfly-system wait --for=delete pod --all --timeout=180s" \
            BOOTSTRAP_PATH=/tmp/nydus-dragonfly/bootstrap \
            WORK_DIR=/tmp/nydus-dragonfly \
            go test -v -run '^${{ matrix.test }}$' -timeout 15m -count=1 dragonfly_test.go harness.go

      - name: Dump logs
        if: always()
        continue-on-error: true
        run: |
          LOG_DIR="/tmp/dragonfly-e2e-logs"
          mkdir -p "${LOG_DIR}"
          kubectl --namespace dragonfly-system get pods -o wide > "${LOG_DIR}/pods.log" 2>&1 || true
          kubectl --namespace dragonfly-system logs statefulset/dragonfly-scheduler --tail=-1 > "${LOG_DIR}/scheduler.log" 2>&1 || true
          kubectl --namespace dragonfly-system logs statefulset/dragonfly-seed-client --tail=-1 > "${LOG_DIR}/seed-client.log" 2>&1 || true
          cp -r /tmp/nydus-dragonfly/logs "${LOG_DIR}/nydus" 2>/dev/null || true

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dragonfly-e2e-logs-${{ matrix.mode }}
          path: /tmp/dragonfly-e2e-logs/

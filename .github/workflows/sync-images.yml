name: Sync Images
run-name: Sync Images (${{ inputs.images || 'all images' }})

on:
  workflow_dispatch:
    inputs:
      images:
        description: Space-separated subset of Docker Hub images to mirror to GHCR, official ones by name and others as namespace/name (default all images in the list)

permissions:
  contents: read
  packages: write

jobs:
  list:
    name: List Images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: List images
        id: list
        env:
          IMAGES_OVERRIDE: ${{ inputs.images }}
        run: |
          if [ -n "$IMAGES_OVERRIDE" ]; then
            images="$IMAGES_OVERRIDE"
          else
            images=$(sed -e 's/#.*$//' -e 's/[[:space:]]//g' -e '/^$/d' \
                         -e "s|^ghcr\.io/[^/]*/[^/]*/||" -e 's/:[^:]*$//' \
                         tests/e2e/nydusify/testdata/images.txt)
          fi
          echo "images=$(printf '%s\n' $images | jq -cRn '[inputs | select(length > 0)]')" >> "$GITHUB_OUTPUT"

  sync:
    needs: list
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        image: ${{ fromJSON(needs.list.outputs.images) }}
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy image to GHCR
        env:
          IMAGE: ${{ matrix.image }}
          GHCR_NAMESPACE: ghcr.io/${{ github.repository }}
        run: |
          case "$IMAGE" in
            */*) src="docker://docker.io/${IMAGE}:latest" ;;
            *) src="docker://docker.io/library/${IMAGE}:latest" ;;
          esac
          dst="docker://${GHCR_NAMESPACE}/${IMAGE}:latest"
          wait=60
          while :; do
            status=0
            out=$(skopeo copy --all --retry-times 3 "$src" "$dst" 2>&1) || status=$?
            echo "$out"
            if [ $status -eq 0 ]; then
              exit 0
            fi
            if printf '%s\n' "$out" | grep -qiE 'manifest unknown|name unknown|not found|404'; then
              echo "::warning::${IMAGE} not found on Docker Hub; skipped."
              exit 0
            fi
            if printf '%s\n' "$out" | grep -qiE 'toomanyrequests|too many requests|429'; then
              echo "Rate limited pulling ${IMAGE}; retrying in ${wait}s."
              sleep "$wait"
              wait=$((wait * 2))
              if [ $wait -gt 900 ]; then
                wait=900
              fi
              continue
            fi
            exit $status
          done

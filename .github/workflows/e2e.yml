name: E2E Test

on:
  push:
    branches: [main, release-*, v3]
    paths-ignore: ['**.md', '**.png', '**.jpg', '**.svg', '**/docs/**']
  pull_request:
    branches: [main, release-*, v3]
    paths-ignore: ['**.md', '**.png', '**.jpg', '**.svg', '**/docs/**']
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.88.0
          components: llvm-tools-preview

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          shared-key: e2e-ci

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ github.token }}

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: nydusify/go.mod
          cache-dependency-path: nydusify/go.sum

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov

      - name: Build binaries
        run: make build-coverage

      - name: Upload binaries
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-binaries
          path: |
            target/ci/nydus
            target/ci/examples/writer-fixture
            nydusify/nydusify
          if-no-files-found: error
          retention-days: 3

  e2e:
    name: e2e (${{ matrix.suite }})
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      COVERAGE: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: image-tools
            pkgs: ./build/... ./export/... ./nydusify/... ./kernel/... ./tar/... ./api/... ./registry/... ./continuity/...
            parallel: 8
          - suite: fuse
            pkgs: ./conformance/...
            run: ^TestFUSE$$
          - suite: kernel
            pkgs: ./conformance/...
            run: ^TestKernel$$
          - suite: fileio-semantics
            pkgs: ./conformance/...
            run: ^TestFileio$$
            skip: ^TestFileio$$/^Data$$
          - suite: fileio-data-zstd
            pkgs: ./conformance/...
            run: ^TestFileio$$/^Data$$/^zstd-4k$$
          - suite: fileio-data-other
            pkgs: ./conformance/...
            run: ^TestFileio$$/^Data$$
            skip: ^TestFileio$$/^Data$$/^zstd-4k$$
          - suite: storage-recovery
            pkgs: ./fault/...
          - suite: storage-cache
            pkgs: ./cache/...
            parallel: 2
          - suite: soak
            pkgs: ./soak/...
            soak-duration: 2m
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.88.0
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: tests/e2e/go.mod
          cache-dependency-path: tests/e2e/go.sum

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-binaries

      - name: Install dependencies
        run: |
          chmod +x target/ci/nydus target/ci/examples/writer-fixture nydusify/nydusify
          sudo apt-get update
          sudo apt-get install -y acl attr fuse3 autoconf automake libtool pkg-config liblz4-dev libzstd-dev uuid-dev
          sudo modprobe fuse

      - name: Checkout erofs-utils
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: erofs/erofs-utils
          ref: 652a204d0ec628c887df88c95f76073502704c52
          path: erofs-utils

      - name: Install erofs-utils
        working-directory: erofs-utils
        run: |
          ./autogen.sh
          ./configure --enable-lz4 --with-libzstd
          make -j"$(nproc)"
          sudo make install
          fsck.erofs -V

      - name: Run E2E test
        env:
          NYDUS_E2E_SOAK_DURATION: ${{ matrix.soak-duration }}
          NYDUS_E2E_LOG_DIR: /tmp/artifact
        run: make e2e-run PKG="${{ matrix.pkgs }}" E2E_RUN='${{ matrix.run }}' E2E_SKIP='${{ matrix.skip }}' E2E_PARALLEL=${{ matrix.parallel || 4 }} E2E_TIMEOUT=4m E2E_GO_TEST_ARGS=-p=2

      - name: Upload logs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: ${{ matrix.suite }}-e2e-tests-logs
          path: /tmp/artifact
          if-no-files-found: ignore

      - name: Export coverage
        run: make coverage-report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        timeout-minutes: 1
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/rust-e2e.lcov,coverage/go-e2e.out
          flags: e2etests
          disable_search: true

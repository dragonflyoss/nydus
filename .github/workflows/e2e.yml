name: E2E Test

on:
  push:
    branches: [main, release-*, v3]
    paths-ignore: ['**.md', '**.png', '**.jpg', '**.svg', '**/docs/**']
  pull_request:
    branches: [main, release-*, v3]
    paths-ignore: ['**.md', '**.png', '**.jpg', '**.svg', '**/docs/**']
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1

jobs:
  e2e_tests:
    name: E2E (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        module: ['fuse', 'fuse-continuity', 'nbd', 'ublk', 'uffd', 'fanotify', 'bench']
        include:
          - module: fuse
            target: test-e2e test-tooci test-fs test-tar-corpus
          - module: fuse-continuity
            target: test-fuse-continuity
          - module: nbd
            target: test-nbd
          - module: ublk
            target: test-ublk
          - module: uffd
            target: test-uffd
            args: UFFD_REQUIRE=1 UFFD_EVIDENCE_DIR=/tmp/artifact/uffd-evidence
          - module: fanotify
            target: test-fanotify
          - module: bench
            target: test-bench

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tests/e2e/go.mod

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq acl attr erofs-utils fio fuse3 xfsprogs
          sudo modprobe erofs || true
          sudo modprobe nbd || true
          sudo modprobe ublk_drv || true
          mkdir -p /tmp/artifact

      - name: Install erofsfuse
        if: matrix.module == 'bench'
        run: |
          sudo bash tests/scripts/setup_erofsfuse.sh

      - name: Setup registry
        run: |
          docker run -d --name registry -p 5000:5000 registry:2
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:5000/v2/ >/dev/null; do sleep 1; done'

      - name: Run E2E test
        run: |
          make ${{ matrix.target }} ${{ matrix.args }}

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.module }}-e2e-tests-logs
          path: /tmp/artifact/**
          if-no-files-found: ignore

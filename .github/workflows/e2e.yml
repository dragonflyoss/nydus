name: E2E Test

on:
  push:
    branches: [master, release-*, v3]
    paths-ignore: ['**.md', '**.png', '**.jpg', '**.svg', '**/docs/**']
  pull_request:
    branches: [master, release-*, v3]
    paths-ignore: ['**.md', '**.png', '**.jpg', '**.svg', '**/docs/**']
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: llvm-tools-preview

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: e2e-ci

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: nydusify/go.mod
          cache-dependency-path: nydusify/go.sum

      - name: Build binaries
        run: make build-coverage

      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: e2e-binaries
          path: |
            target/ci/nydus
            target/ci/examples/writer-fixture
            nydusify/nydusify
            coverage-tools/
          if-no-files-found: error
          retention-days: 3

  e2e:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: image-tools
            pkgs: ./internal/... ./build/... ./export/... ./nydusify/... ./kernel/... ./tar/... ./api/... ./registry/... ./continuity/...
            parallel: 8
          - suite: fuse
            pkgs: ./contract/...
            run: ^TestFUSE$$
          - suite: fileio-semantics
            pkgs: ./contract/...
            run: ^TestFileio$$/^(Semantic|C[0-9]+_.*)$$
          - suite: fileio-data-zstd
            pkgs: ./contract/...
            run: ^TestFileio$$/^Data$$/^zstd-4k$$
          - suite: fileio-data-other
            pkgs: ./contract/...
            run: ^TestFileio$$/^Data$$/^(erofs-lz4|tar-zstd|merged-zstd-4k|huge-zstd)$$
          - suite: storage-recovery
            pkgs: ./fault/...
          - suite: storage-cache
            pkgs: ./cache/...
            parallel: 2
          - suite: soak
            pkgs: ./soak/...
            soak-duration: 2m
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tests/e2e/go.mod
          cache-dependency-path: tests/e2e/go.sum

      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          name: e2e-binaries

      - name: Install dependencies
        run: |
          chmod +x target/ci/nydus target/ci/examples/writer-fixture nydusify/nydusify
          bash tests/scripts/install_ci_packages.sh acl attr erofs-utils fuse3
          sudo modprobe fuse

      - name: Run E2E test
        env:
          NYDUS_E2E_SOAK_DURATION: ${{ matrix.soak-duration }}
        run: make e2e-run PKG="${{ matrix.pkgs }}" E2E_RUN='${{ matrix.run }}' E2E_PARALLEL=${{ matrix.parallel || 4 }} E2E_TIMEOUT=4m E2E_GO_TEST_ARGS=-p=2

      - name: Export coverage
        run: bash tests/scripts/e2e_coverage.sh export

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        timeout-minutes: 1
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/rust-e2e.lcov,coverage/go-e2e.out
          flags: e2etests
          disable_search: true

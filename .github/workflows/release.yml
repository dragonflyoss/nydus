name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  FEATURES: cli,uffd,fanotify,fileio,dragonfly

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: nydusify/go.mod
          cache-dependency-path: nydusify/go.sum

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev pkg-config perl make file

      - name: Build nydus
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          cargo build -p nydus --release \
            --target ${{ matrix.target }} \
            --features "${FEATURES}"

      - name: Build nydusify
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          cd nydusify
          go build -ldflags "-s -w" -o nydusify .

      - name: Package release tarball
        run: |
          mkdir nydus-static
          cp target/${{ matrix.target }}/release/nydus nydusify/nydusify config/registry.example.yaml nydus-static/
          for bin in nydus-static/nydus nydus-static/nydusify; do
            file "${bin}" | grep -Eq 'statically linked|static-pie linked'
            "./${bin}" --help > /dev/null
          done
          tarball="nydus-static-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.tgz"
          tar cf - nydus-static | gzip > "${tarball}"
          sha256sum "${tarball}" > "${tarball}.sha256sum"
          echo "tarball=${tarball}" >> "${GITHUB_ENV}"

      - name: Upload release tarball
        uses: actions/upload-artifact@v6
        with:
          name: nydus-release-tarball-linux-${{ matrix.arch }}
          path: |
            ${{ env.tarball }}
            ${{ env.tarball }}.sha256sum
          if-no-files-found: error

  release:
    name: Release
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download release tarballs
        uses: actions/download-artifact@v7
        with:
          pattern: nydus-release-tarball-*
          merge-multiple: true
          path: nydus-tarball

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Nydus ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          files: nydus-tarball/*
          fail_on_unmatched_files: true

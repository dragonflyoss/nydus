name: Release

on:
  push:
    tags:
      - v*
    branches:
      - main
      - v3
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  FEATURES: cli,uffd,fanotify,fileio,dragonfly
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly' }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ github.token }}

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: nydusify/go.mod
          cache-dependency-path: nydusify/go.sum

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev pkg-config perl make file

      - name: Build nydus
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          cargo build -p nydus --release \
            --target ${{ matrix.target }} \
            --features "${FEATURES}"

      - name: Build nydusify
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          cd nydusify
          go build -ldflags "-s -w" -o nydusify .

      - name: Package release tarball
        run: |
          mkdir nydus-static
          cp target/${{ matrix.target }}/release/nydus nydusify/nydusify config/registry.example.yaml nydus-static/
          for bin in nydus-static/nydus nydus-static/nydusify; do
            file "${bin}" | grep -Eq 'statically linked|static-pie linked'
            "./${bin}" --help > /dev/null
          done
          tarball="nydus-static-${RELEASE_TAG}-linux-${{ matrix.arch }}.tgz"
          tar cf - nydus-static | gzip > "${tarball}"
          sha256sum "${tarball}" > "${tarball}.sha256sum"
          echo "tarball=${tarball}" >> "${GITHUB_ENV}"

      - name: Upload release tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nydus-release-tarball-linux-${{ matrix.arch }}
          path: |
            ${{ env.tarball }}
            ${{ env.tarball }}.sha256sum
          if-no-files-found: error

  release:
    name: Release
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download release tarballs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: nydus-release-tarball-*
          merge-multiple: true
          path: nydus-tarball

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Nydus ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          files: nydus-tarball/*
          fail_on_unmatched_files: true

      - name: Publish nightly release
        if: "!startsWith(github.ref, 'refs/tags/')"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly nydus-tarball/* --prerelease --target "$GITHUB_SHA" \
            --title "Nydus nightly" \
            --notes "Nightly build of ${GITHUB_REF_NAME} at ${GITHUB_SHA}. Not a stable release."

  publish-crates:
    name: Publish crates
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.88.0

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ github.token }}

      - name: Publish crates
        uses: katyo/publish-crates@02cc2f1ad653fb25c7d1ff9eb590a8a50d06186b # v2
        with:
          registry-token: ${{ secrets.CRATES_IO_TOKEN }}
          ignore-unpublished-changes: true
          args: --locked

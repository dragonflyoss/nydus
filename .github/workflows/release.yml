name: Release

on:
  push:
    tags:
      - v*
    branches:
      - main
      - v3
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  FEATURES: cli,uffd,fanotify,fileio,dragonfly
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly' }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: nydusify/go.mod
          cache-dependency-path: |
            nydusify/go.sum
            nydus-snapshotter/go.sum

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev pkg-config perl make file

      - name: Build nydus
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          cargo build -p nydus --release \
            --target ${{ matrix.target }} \
            --features "${FEATURES}"

      - name: Build nydusify
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          cd nydusify
          go build -ldflags "-s -w" -o nydusify .

      - name: Build nydus-snapshotter
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: make -C nydus-snapshotter build VERSION="${RELEASE_TAG}"

      - name: Package release tarball
        run: |
          mkdir nydus-static
          cp target/${{ matrix.target }}/release/nydus nydusify/nydusify nydus-snapshotter/bin/nydus-snapshotter config/registry.example.yaml nydus-static/
          for bin in nydus-static/nydus nydus-static/nydusify nydus-static/nydus-snapshotter; do
            file "${bin}" | grep -Eq 'statically linked|static-pie linked'
            "./${bin}" --help > /dev/null
          done
          tarball="nydus-static-${RELEASE_TAG}-linux-${{ matrix.arch }}.tgz"
          tar cf - nydus-static | gzip > "${tarball}"
          sha256sum "${tarball}" > "${tarball}.sha256sum"
          echo "tarball=${tarball}" >> "${GITHUB_ENV}"

      - name: Upload release tarball
        uses: actions/upload-artifact@v6
        with:
          name: nydus-release-tarball-linux-${{ matrix.arch }}
          path: |
            ${{ env.tarball }}
            ${{ env.tarball }}.sha256sum
          if-no-files-found: error

  # Package the build job's binaries natively per platform and push them by
  # digest, then merge the digests into one multi-arch image tagged like the
  # release, nightly included, refer to
  # https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners.
  image:
    name: image (${{ matrix.arch }})
    needs: [build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download release tarball
        uses: actions/download-artifact@v7
        with:
          name: nydus-release-tarball-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/tarball

      # The binaries stage of the Dockerfile is replaced with the tarball's
      # binaries, so the image ships exactly what the release publishes, with
      # the version, commit and build time the Makefile stamped into them.
      - name: Extract binaries
        run: |
          mkdir "${RUNNER_TEMP}/binaries"
          tar -xzf "${RUNNER_TEMP}/tarball/nydus-static-${RELEASE_TAG}-linux-${{ matrix.arch }}.tgz" \
            -C "${RUNNER_TEMP}/binaries" --strip-components=1 nydus-static/nydus nydus-static/nydus-snapshotter

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nydus-snapshotter/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-contexts: binaries=${{ runner.temp }}/binaries
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/nydus-snapshotter,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p digests
          digest="${{ steps.build.outputs.digest }}"
          touch "digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: nydus-snapshotter-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge
    needs: [image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/nydus-snapshotter
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          pattern: nydus-snapshotter-digest-*
          merge-multiple: true
          path: digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        id: manifest
        working-directory: digests
        run: |
          docker buildx imagetools create -t "${IMAGE}:${RELEASE_TAG}" \
            --annotation "index:org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.description=Installer of nydus-snapshotter, a containerd proxy snapshotter for Nydus v3 images" \
            --annotation "index:org.opencontainers.image.version=${RELEASE_TAG}" \
            $(printf "${IMAGE}@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "${IMAGE}:${RELEASE_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  release:
    name: Release
    needs: [build, merge]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download release tarballs
        uses: actions/download-artifact@v7
        with:
          pattern: nydus-release-tarball-*
          merge-multiple: true
          path: nydus-tarball

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Nydus ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          files: nydus-tarball/*
          fail_on_unmatched_files: true

      - name: Publish nightly release
        if: "!startsWith(github.ref, 'refs/tags/')"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly nydus-tarball/* --prerelease --target "$GITHUB_SHA" \
            --title "Nydus nightly" \
            --notes "Nightly build of ${GITHUB_REF_NAME} at ${GITHUB_SHA}. Not a stable release."

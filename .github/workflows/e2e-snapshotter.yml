name: E2E Test With Snapshotter

on:
  push:
    branches: [main, release-*, v3]
    paths-ignore: ['**.md', '**.png', '**.jpg', '**.svg', '**/docs/**']
  pull_request:
    branches: [main, release-*, v3]
    paths-ignore: ['**.md', '**.png', '**.jpg', '**.svg', '**/docs/**']
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  RUNC_VERSION: 1.5.2

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: e2e-snapshotter

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: nydus-snapshotter/go.mod
          cache-dependency-path: |
            nydusify/go.sum
            nydus-snapshotter/go.sum

      - name: Build binaries
        run: |
          make build-ci build-nydusify FEATURES=cli,fuse
          make build-snapshotter COVERAGE=1

      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: e2e-snapshotter-binaries
          path: |
            target/ci/nydus
            nydusify/nydusify
            nydus-snapshotter/bin/nydus-snapshotter
          if-no-files-found: error
          retention-days: 3

  test:
    name: test (${{ matrix.containerd }})
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      COVERAGE: 1
    strategy:
      fail-fast: false
      matrix:
        containerd: [1.6.39, 2.3.7]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tests/e2e/go.mod
          cache-dependency-path: tests/e2e/go.sum

      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          name: e2e-snapshotter-binaries

      - name: Install dependencies
        run: |
          chmod +x target/ci/nydus nydusify/nydusify nydus-snapshotter/bin/nydus-snapshotter
          sudo apt-get update
          sudo apt-get install -y busybox-static fuse3
          sudo modprobe fuse

      - name: Install containerd and runc
        working-directory: ${{ runner.temp }}
        run: |
          containerd="containerd-${{ matrix.containerd }}-linux-amd64.tar.gz"
          curl -fsSL --retry 2 -O "https://github.com/containerd/containerd/releases/download/v${{ matrix.containerd }}/${containerd}"{,.sha256sum}
          sha256sum -c "${containerd}.sha256sum"
          mkdir -p containerd && tar -xzf "${containerd}" -C containerd
          curl -fsSL --retry 2 -O "https://github.com/opencontainers/runc/releases/download/v${RUNC_VERSION}/runc.amd64" \
            -O "https://github.com/opencontainers/runc/releases/download/v${RUNC_VERSION}/runc.sha256sum"
          grep ' runc.amd64$' runc.sha256sum | sha256sum -c -
          install -m 0755 runc.amd64 runc

      - name: Run E2E test
        env:
          NYDUS_E2E_CONTAINERD: ${{ runner.temp }}/containerd/bin/containerd
          NYDUS_E2E_RUNC: ${{ runner.temp }}/runc
        run: make e2e-run PKG=./snapshotter/... E2E_PARALLEL=4 E2E_TIMEOUT=6m

      - name: Export coverage
        run: go tool covdata textfmt -i=coverage/raw/go -o=coverage/go-e2e.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        timeout-minutes: 1
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/go-e2e.out
          flags: e2etests
          disable_search: true

      - name: Export logs
        if: failure()
        run: |
          mkdir -p /tmp/artifact
          sudo journalctl --no-pager -o short-precise SYSLOG_IDENTIFIER=nydusd > /tmp/artifact/nydusd.log 2>&1 || true
          sudo dmesg > /tmp/artifact/dmesg.log 2>&1 || true
          findmnt > /tmp/artifact/mounts.log 2>&1 || true

      - name: Upload logs
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: snapshotter-e2e-tests-logs-${{ matrix.containerd }}
          path: /tmp/artifact
          if-no-files-found: ignore

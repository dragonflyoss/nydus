name: Fuzz

on:
  push:
    branches: [main, release-*, v3]
    paths-ignore: ['**.md', '**.png', '**.jpg', '**.svg', '**/docs/**']
  pull_request:
    branches: [main, release-*, v3]
    paths-ignore: ['**.md', '**.png', '**.jpg', '**.svg', '**/docs/**']
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COVERAGE: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.88.0
          components: llvm-tools-preview

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          shared-key: e2e-ci

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ github.token }}

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: tests/e2e/go.mod
          cache-dependency-path: |
            nydusify/go.sum
            tests/e2e/go.sum

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          sudo modprobe fuse

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov

      - name: Build binaries
        run: make build-coverage

      - name: Run fuzz test
        env:
          FUZZ_TIME: ${{ github.event_name == 'schedule' && '10m' || '150s' }}
          TEST_TIMEOUT: ${{ github.event_name == 'schedule' && '12m' || '4m' }}
        run: |
          make e2e-run PKG=./tar/ E2E_RUN='^$$' E2E_PARALLEL=4 \
            E2E_TIMEOUT="$TEST_TIMEOUT" E2E_GO_TEST_ARGS="-fuzz ^FuzzTarConversion -fuzztime $FUZZ_TIME" &
          tar_pid=$!
          make e2e-run PKG=./build/ E2E_RUN='^$$' E2E_PARALLEL=4 \
            E2E_TIMEOUT="$TEST_TIMEOUT" E2E_GO_TEST_ARGS="-fuzz ^FuzzBlobFormat -fuzztime $FUZZ_TIME" &
          blob_pid=$!
          status=0
          wait "$tar_pid" || status=1
          wait "$blob_pid" || status=1
          exit "$status"

      - name: Export coverage
        run: make coverage-report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        timeout-minutes: 1
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/rust-e2e.lcov
          flags: fuzz
          disable_search: true

      - name: Upload fuzz failures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-failures
          path: tests/e2e/**/testdata/fuzz/
          if-no-files-found: ignore

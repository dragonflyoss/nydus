backend:
  type: registry
  config:
    addr: http://172.30.0.1:18080
    repository: nydus-e2e/dragonfly
    http:
      timeout: 5s
      max_retries: 0
    dragonfly:
      scheduler_endpoint: http://127.0.0.1:8002
      timeout: 5s
      max_retries: 1
      back_to_source:
        request_rate_limit: 0
storage:
  dir: /tmp/nydus-dragonfly/cache
prefetch:
  scope: none

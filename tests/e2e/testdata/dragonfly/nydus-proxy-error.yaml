backend:
  type: registry
  config:
    addr: http://172.30.0.1:18080
    repository: nydus-e2e/dragonfly
    http:
      timeout: 5s
      max_retries: 0
    dragonfly:
      scheduler_endpoint: http://127.0.0.1:8002
      ondemand_max_retries: 3
      prefetch_max_retries: 2
      fallback_interval: 0s
storage:
  dir: /tmp/nydus-dragonfly/cache
prefetch:
  scope: none

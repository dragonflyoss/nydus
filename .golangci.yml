version: "2"

run:
  timeout: 10m
  build-tags:
    - manual

linters:
  enable:
    - bodyclose
    - misspell
    - testifylint
    - unconvert
  settings:
    misspell:
      ignore-rules:
        - hardlinked
    testifylint:
      disable:
        - float-compare
        - require-error

formatters:
  enable:
    - gofmt
    - goimports

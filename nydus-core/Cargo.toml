[package]
name = "nydus-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "The nydus image reader: EROFS reading and path resolution over the data-plane crates, plus the NydusCore/Blobs runtime entry points the services drive."
repository = "https://github.com/dragonflyoss/nydus"
readme = "README.md"

[dependencies]
zstd = "0.13"
libc = { workspace = true }
memmap2 = { workspace = true }
nydus-backend = { version = "0.1.0", path = "../nydus-backend" }
nydus-config = { version = "0.1.0", path = "../nydus-config" }
nydus-error = { version = "0.1.0", path = "../nydus-error" }
nydus-format = { version = "0.1.0", path = "../nydus-format" }
nydus-storage = { version = "0.1.0", path = "../nydus-storage" }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

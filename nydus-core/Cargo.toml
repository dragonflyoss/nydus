[package]
name = "nydus-core"
version = "3.0.0-alpha.1"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "The nydus image reader: EROFS reading and path resolution over the data-plane crates, plus the NydusCore/Blobs runtime entry points the services drive."
repository = "https://github.com/dragonflyoss/nydus"
readme = "README.md"

[dependencies]
blake3 = "1"
crc32c = "0.6"
libc = { workspace = true }
lz4_flex = "0.11"
memmap2 = { workspace = true }
nydus-backend = { version = "3.0.0-alpha.1", path = "../nydus-backend" }
nydus-config = { version = "3.0.0-alpha.1", path = "../nydus-config" }
nydus-error = { version = "3.0.0-alpha.1", path = "../nydus-error" }
nydus-format = { version = "3.0.0-alpha.1", path = "../nydus-format" }
nydus-storage = { version = "3.0.0-alpha.1", path = "../nydus-storage" }
sha2 = { workspace = true }
tracing = { workspace = true }
xattr = { workspace = true }
zstd = "0.13"

[dev-dependencies]
tempfile = { workspace = true }

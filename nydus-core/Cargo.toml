[package]
name = "nydus-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "Runtime core APIs for EROFS-based Nydus images: metadata parsing, on-demand blob caching and storage backends."
repository = "https://github.com/dragonflyoss/nydus"
readme = "README.md"

[features]
default = []
# Container image registry backend (OCI distribution).
backend-registry = [
  "dep:reqwest",
  "dep:url",
  "dep:arc-swap",
  "dep:futures",
  "dep:rand",
  "dep:tokio",
]
# Dragonfly P2P SDK proxy support for the registry backend.
backend-dragonfly-proxy = [
  "backend-registry",
  "dep:dragonfly-client-request",
]

[dependencies]
anyhow = { workspace = true }
arc-swap = { version = "1", optional = true }
bitflags = "2"
blake3 = "1"
crc32c = "0.6"
dragonfly-client-request = { version = "=1.4.0", optional = true }
futures = { version = "0.3", optional = true }
libc = { workspace = true }
memmap2 = { workspace = true }
prometheus = { version = "0.13", default-features = false }
rand = { version = "0.8", optional = true }
rolling-file = "0.2.0"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "stream",
], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "net",
  "rt",
  "rt-multi-thread",
  "sync"
], optional = true }
tracing = { workspace = true }
tracing-appender = "0.2.4"
tracing-panic = "0.1.2"
tracing-subscriber = { version = "0.3", features = [
  "chrono",
  "env-filter",
  "time"
] }
url = { version = "2", optional = true }
xattr = { workspace = true }
zstd = "0.13"

[dev-dependencies]

[package]
name = "nydus-core"
version = "3.0.0-beta.2"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "The nydus image reader: EROFS reading and path resolution over the data-plane crates, plus the NydusCore/Blobs runtime entry points the services drive."
repository = "https://github.com/dragonflyoss/nydus"
readme = "README.md"

[dependencies]
crc32c = "0.6"
hex = { workspace = true }
lz4-sys = "1"
zstd = "0.13"
lz4_flex = "0.11"
libc = { workspace = true }
memmap2 = { workspace = true }
nydus-backend = { version = "3.0.0-beta.2", path = "../nydus-backend" }
nydus-config = { version = "3.0.0-beta.2", path = "../nydus-config" }
nydus-error = { version = "3.0.0-beta.2", path = "../nydus-error" }
nydus-format = { version = "3.0.0-beta.2", path = "../nydus-format" }
nydus-storage = { version = "3.0.0-beta.2", path = "../nydus-storage" }
sha2 = { workspace = true }
tracing = { workspace = true }
xattr = { workspace = true }

[dev-dependencies]
blake3 = "1"
tempfile = { workspace = true }

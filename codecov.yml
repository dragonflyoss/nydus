coverage:
  precision: 2
  round: down
  range: '50...100'
  status:
    project:
      rust:
        target: 90%
        paths: ['nydus/', 'nydus-*/', '!nydus-snapshotter/']
      go:
        target: 90%
        paths: ['nydusify/']
      snapshotter:
        target: auto
        paths: ['nydus-snapshotter/']
    patch:
      default:
        enabled: no

ignore:
  - 'tests/'
  - '**/examples/'
  - '**/*_test.go'
  - 'nydusify/internal/registrytest/'
  - '**/mocks/'

comment:
  layout: 'reach, diff, flags, files'
  behavior: default
  require_changes: false
  branches:
    - main
    - v3

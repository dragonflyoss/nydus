host:
  schedulerClusterID: 1

manager:
  addr: http://127.0.0.1:65003

seedPeer:
  enable: true
  type: super

scheduler:
  # Re-register after scheduler outages within the cluster readiness budget.
  announceInterval: 5s

upload:
  server:
    port: 4000

proxy:
  server:
    port: 4001

storage:
  dir: /tmp/dragonfly/storage

server:
  cacheDir: /tmp/dragonfly/cache/dfdaemon
  logDir: /tmp/dragonfly/logs/dfdaemon

download:
  server:
    socketPath: /tmp/dragonfly/dfdaemon.sock

# Short, so a dfdaemon started while the scheduler was still registering
# with the manager picks it up quickly.
dynconfig:
  refreshInterval: 10s

console: true

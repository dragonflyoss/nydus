[workspace]
resolver = "2"
members = ["nydus", "nydus-backend", "nydus-config", "nydus-core", "nydus-error", "nydus-format", "nydus-storage", "nydus-telemetry"]

# fuser 0.18.0 plus the live-session handoff and crash-failover primitives
# (handshake-skip constructor, pausable event loops, mount disarm, inflight
# journal and recovery), kept on a fork until they land upstream.
[patch.crates-io]
fuser = { git = "https://github.com/Zephyrcf/fuser.git", tag = "0.18.0-upgrade-rc2" }

[workspace.dependencies]
clap = { version = "4", features = ["derive", "env", "string"] }
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3.1.0"
thiserror = "2"
tokio = "1"
tracing = "0.1"
xattr = "1"

[profile.bench]
debug = true

[profile.dev]
opt-level = 0
debug = true
strip = false
incremental = true

[profile.release]
opt-level = 3
strip = "symbols"
lto = "fat"
panic = "abort"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = false
panic = "unwind"

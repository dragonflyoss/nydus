[workspace]
resolver = "2"
members = ["nydus", "nydus-backend", "nydus-config", "nydus-core", "nydus-error", "nydus-format", "nydus-storage", "nydus-telemetry", "nydus-test-utils"]

# Use fuser's handoff APIs until dragonflyoss/fuser#1 lands
# (Zephyrcf/fuser branch session-handoff-and-recovery).
[patch.crates-io]
fuser = { git = "https://github.com/Zephyrcf/fuser.git", rev = "675d99605556c609079d23c5600222cd5e569922" }

[workspace.dependencies]
clap = { version = "4", features = ["derive", "env", "string"] }
hex = "0.4"
libc = "0.2"
memmap2 = "0.9"
prometheus = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "asm" is what selects the SHA2 CPU instructions on aarch64; x86_64 detects
# SHA-NI at runtime regardless.
sha2 = { version = "0.10", features = ["asm"] }
tempfile = "3.1.0"
thiserror = "2"
tokio = "1"
tracing = "0.1"
xattr = "1"

[profile.bench]
debug = true

[profile.dev]
opt-level = 0
debug = true
strip = false
incremental = true

[profile.release]
opt-level = 3
strip = "symbols"
lto = "fat"
panic = "abort"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = false
panic = "unwind"

# The binaries the e2e suites run in CI: optimized, but without the minutes
# of fat LTO, and with overflow checks and debug assertions on so the suites
# also catch broken invariants.
[profile.ci]
inherits = "release"
lto = "off"
codegen-units = 16
overflow-checks = true
debug-assertions = true

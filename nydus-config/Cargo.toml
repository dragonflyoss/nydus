[package]
name = "nydus-config"
version = "3.0.0-alpha.1"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "YAML storage configuration for nydus: the typed schema, loading and validation."
repository = "https://github.com/dragonflyoss/nydus"
readme = "README.md"

[dependencies]
clap = { workspace = true }
humantime-serde = "1"
nydus-error = { version = "3.0.0-alpha.1", path = "../nydus-error" }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { workspace = true }
serde_yaml = "0.9"

[dev-dependencies]
tempfile = { workspace = true }

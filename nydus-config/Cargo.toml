[package]
name = "nydus-config"
version = "3.0.0-beta.3"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "YAML storage configuration for nydus: the typed schema, loading and validation."
repository = "https://github.com/dragonflyoss/nydus"
readme = "README.md"

[features]
# Serves the `dragonfly` block of a registry backend; a build without it
# ignores the block. Enabled by `nydus-backend/dragonfly`.
dragonfly = []

[dependencies]
clap = { workspace = true }
humantime-serde = { workspace = true }
nydus-error = { version = "3.0.0-beta.3", path = "../nydus-error" }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { workspace = true }
serde_yaml = "0.9"
url = { version = "2", features = ["serde"] }
validator = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

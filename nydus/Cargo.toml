[package]
name = "nydus"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "EROFS-oriented image tooling and runtime core APIs for Nydus images."
repository = "https://github.com/dragonflyoss/nydus"
readme = "../README.md"

[[bin]]
name = "nydus"
path = "src/bin/nydus/main.rs"
required-features = ["cli"]

[features]
default = ["backend-registry"]
# FUSE mount support (ErofsFs over fuser).
fuse = ["dep:fuser", "dep:signal-hook"]
# The `nydus` CLI binary: subcommands, apiserver, file logging, signals.
cli = [
  "fuse",
  "dep:bytesize",
  "dep:clap",
  "dep:http-body-util",
  "dep:hyper",
  "dep:hyper-util",
  "dep:signal-hook",
  "dep:tokio",
  "dep:uuid",
]
# Device-level userfaultfd service for microVM virtio-pmem use cases.
# This is intentionally not part of the default or builtin core path.
uffd = [
  "dep:sendfd",
  "dep:tokio",
]
# Serve an EROFS multi-device image on demand through fanotify pre-content
# hooks (FAN_CLASS_PRE_CONTENT + FAN_PRE_ACCESS). Requires Linux >= 6.15.
fanotify = []
# Export a nydus image as a block device through the NBD protocol.
nbd = []
# Container image registry backend (OCI distribution).
backend-registry = ["nydus-backend/backend-registry"]
# Dragonfly P2P SDK proxy support for the registry backend.
backend-dragonfly-proxy = [
  "backend-registry",
  "nydus-backend/backend-dragonfly-proxy",
]
# ublk block device target: expose the flattened image as /dev/ublkbN so the
# kernel EROFS driver can mount it directly. Requires Linux >= 6.0 (ublk_drv).
ublk = ["dep:libublk"]

[dependencies]
blake3 = "1"
bytesize = { version = "1", optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
crc32c = "0.6"
fuser = { version = "0.17", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
libc = { workspace = true }
libublk = { version = "0.4", default-features = false, optional = true }
memmap2 = { workspace = true }
nydus-backend = { version = "0.1.0", path = "../nydus-backend" }
nydus-config = { version = "0.1.0", path = "../nydus-config" }
nydus-error = { version = "0.1.0", path = "../nydus-error" }
nydus-format = { version = "0.1.0", path = "../nydus-format" }
nydus-core = { version = "0.1.0", path = "../nydus-core" }
nydus-storage = { version = "0.1.0", path = "../nydus-storage" }
nydus-telemetry = { version = "0.1.0", path = "../nydus-telemetry", features = [
  "logging",
] }
serde = { workspace = true }
serde_json = { workspace = true }
sendfd = { version = "0.4", optional = true }
sha2 = { workspace = true }
signal-hook = { version = "0.3", optional = true }
tar = "0.4"
zstd = "0.13"
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "sync"
], optional = true }
tracing = { workspace = true }
uuid = { version = "1", features = ["v4"], optional = true }
xattr = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

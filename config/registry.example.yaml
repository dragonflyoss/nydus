# Example storage config for `nydus fuse --config <config>`. Copy and edit
# before use.
#
# This config serves blobs from an OCI image registry instead of a local
# directory. Mount with:
#
#   nydus fuse --bootstrap layer.bootstrap --config config/registry.example.yaml \
#     --mountpoint /mnt/nydus
#
# Note: `nydus check` only supports the `local` backend; this registry config
# is intended for `nydus fuse`.

backend:
  type: registry
  config:
    # Registry address including the scheme; the scheme selects between TLS
    # and plain HTTP. For the official Docker registry use
    # "https://registry-1.docker.io"; for a local distribution registry
    # started with --plain-http use "http://127.0.0.1:5000". A path becomes
    # the prefix of the distribution API path, for a registry behind a
    # reverse proxy.
    addr: http://127.0.0.1:5000

    # Image repository (no tag/digest), e.g. "library/ubuntu".
    repository: library/nydus-demo

    # Optional basic-auth credential: the base64-encoded `username:password`
    # string. Omit `auth` entirely for anonymous / token-only registries.
    # e.g. `printf 'testuser:testpassword' | base64` -> dGVzdHVzZXI6dGVzdHBhc3N3b3Jk
    auth: dGVzdHVzZXI6dGVzdHBhc3N3b3Jk

    # HTTP client settings of every request to the origin registry:
    # timeouts, retries, and TLS trust, the reads Dragonfly falls back to the
    # origin with included. The whole block and every field are optional.
    http:
      # Timeout of a request to the origin registry (connect + read), e.g.
      # `5s` or `1m`, greater than zero. Default: 5s. Kept short because a
      # read holds its chunk group's fetch claim for its whole duration, and
      # the readers waiting behind that claim are FUSE worker threads.
      request_timeout: 5s

      # Maximum number of retry attempts per request, applied by the HTTP
      # client's retry middleware on direct origin requests and on origin
      # requests issued when Dragonfly cannot serve a read. A prefetch read
      # still failing after them is retried once hours later. Default: 3.
      max_retries: 3

      # Optional proxy block routing every registry request through an HTTP
      # forward proxy. Requests keep their original upstream URL, so a proxy
      # like a Dragonfly dfdaemon knows what to back-source. Omit to connect
      # directly to the origin.
      #
      # proxy:
      #   # The proxy address including the scheme.
      #   addr: http://127.0.0.1:65001

      # TLS settings for connections to the registry.
      tls:
        # Skip TLS certificate verification (also tolerates self-signed
        # certs). Ignored for an `http` address. Default: false.
        skip_verify: false

        # Optional CA certificate path with PEM format to trust in addition
        # to the system roots; the file may bundle multiple certificates.
        # Useful for registries fronted by a private CA.
        #
        # ca_cert: /etc/nydus/certs/registry-ca.pem

    # Optional Dragonfly block (requires the `dragonfly` feature). When set,
    # blob GETs are routed through the Dragonfly client SDK for P2P
    # distribution. An on-demand read the seed peers cannot serve goes back
    # to the origin registry through the `http` client above under
    # `fallback_rate_limit`, a prefetch read is retried once hours later
    # instead. Auth token fetches go directly to the origin registry. Omit to
    # talk to the origin directly.
    #
    # dragonfly:
    #   # The Dragonfly scheduler service address with the scheme.
    #   scheduler_endpoint: http://dragonfly-scheduler.dragonfly-system.svc:8002
    #
    #   # Timeout of each attempt of a request through the seed peers, e.g.
    #   # `5s` or `1m`. Default: 5s.
    #   request_timeout: 5s
    #
    #   # Retries of an on-demand read on a transient failure (timeout,
    #   # connection, dfdaemon, 5xx, 408, 429), each on the next seed peer
    #   # after an exponential backoff. Default: 1, at most 3. A prefetch read
    #   # is instead retried once after a random delay of
    #   # `prefetch.retry_interval` to twice that, 6h-12h by default.
    #   max_retries: 1
    #
    #   # Rate limit of the origin requests an on-demand read falls back to
    #   # when the seed peers cannot serve it, in requests per second, at
    #   # least 1; every attempt, retries included, waits for a slot.
    #   # Default: 1.
    #   fallback_rate_limit: 1

storage:
  # Persistent chunk cache directory (equivalent to --cache-dir). Optional:
  # when unset (or the whole `storage` section is omitted), reads run
  # diskless — every read fetches from the backend directly and nothing is
  # written to disk. Kernel-served modes (fanotify/nbd/ublk/uffd) and
  # `nydus optimize` require a directory.
  dir: /var/lib/nydus/cache
  # Skip checking decoded chunk groups against their crc32c before they are
  # served. Default: false, every group is checked; set this to true when
  # the transport is trusted end to end.
  # skip_verify_checksums: false
  # Compressed bytes one on-demand backend read covers: the chunk groups
  # whose compressed ranges overlap the fetch-size-aligned cell holding the
  # missed group, trimmed at groups already cached or being fetched. Larger
  # sizes make fewer, larger requests (better over high per-request
  # latency); smaller sizes transfer fewer unused bytes (better over
  # limited bandwidth). 0 fetches the missed group alone. Independent of the
  # image's chunk size. Default: 2097152 (2 MiB).
  # fetch_size: 2097152

prefetch:
  # Number of concurrently prefetched blobs.
  concurrent_blob_count: 10
  # Timeout of prefetching one whole blob, e.g. `1h`, while
  # `http.request_timeout` bounds each backend request within it. `0s`
  # disables the bound. Default: 1h.
  request_timeout: 1h
  # Which blobs to pull: `none` disables prefetch; `ondemand` prefetches
  # only the "ondemand" blob produced by `nydus optimize`, which holds the
  # recorded hot set in access order, without pulling the whole image; `all`
  # prefetches every blob, so the entire image ends up in the local cache;
  # `auto` (default) behaves like `ondemand` when the image has an ondemand
  # blob and like `all` otherwise.
  scope: auto

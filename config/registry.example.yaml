# Example storage config for `nydus fuse --config <config>`. Copy and edit
# before use.
#
# This config serves blobs from an OCI image registry instead of a local
# directory. Mount with:
#
#   nydus fuse --bootstrap layer.bootstrap --config config/registry.example.yaml --mountpoint /mnt/nydus
#
# Note: `nydus check` only supports the `local` backend; this registry config
# is intended for `nydus fuse`.

backend:
  type: registry
  config:
    # Registry address including the scheme; the scheme selects between TLS
    # and plain HTTP. For the official Docker registry use
    # "https://registry-1.docker.io"; for a local distribution registry
    # started with --plain-http use "http://127.0.0.1:5000".
    addr: http://127.0.0.1:5000

    # Image repository (no tag/digest), e.g. "library/ubuntu".
    repository: library/nydus-demo

    # Optional basic-auth credential: the base64-encoded `username:password`
    # string. Omit `auth` entirely for anonymous / token-only registries.
    # e.g. `printf 'testuser:testpassword' | base64` -> dGVzdHVzZXI6dGVzdHBhc3N3b3Jk
    auth: dGVzdHVzZXI6dGVzdHBhc3N3b3Jk

    # HTTP client settings of requests to the origin registry: timeouts,
    # retries, and TLS trust. The whole block and every field are optional.
    http:
      # Per-request timeout (connect + read), e.g. `5s` or `1m`; `0s` disables
      # it. Default: 5s. Kept short because a read holds the block group's fetch
      # claim for its whole duration, and the readers waiting behind that
      # claim are FUSE worker threads.
      timeout: 5s

      # Maximum number of retry attempts per request, applied by the HTTP
      # client's retry middleware on direct origin requests and on origin
      # requests issued when Dragonfly cannot serve a read. Default: 3.
      max_retries: 3

      # Optional proxy block routing every registry request through an HTTP
      # forward proxy. Requests keep their original upstream URL, so a proxy
      # like a Dragonfly dfdaemon knows what to back-source. Omit to connect
      # directly to the origin.
      #
      # proxy:
      #   # The proxy address including the scheme.
      #   addr: http://127.0.0.1:65001

      # TLS settings for connections to the registry.
      tls:
        # Skip TLS certificate verification (also tolerates self-signed
        # certs). Ignored for an `http` address. Default: false.
        skip_verify: false

        # Optional CA certificate path with PEM format to trust in addition
        # to the system roots; the file may bundle multiple certificates.
        # Useful for registries fronted by a private CA.
        #
        # ca_cert: /etc/nydus/certs/registry-ca.pem

    # Optional Dragonfly block (requires the `backend-dragonfly-proxy`
    # feature). When set, blob GETs are routed through the Dragonfly client
    # SDK for P2P distribution. An on-demand read the seed peers cannot serve
    # goes back to the origin registry through a rate limit, a prefetch read
    # is rescheduled hours later instead. Every other request goes directly
    # to the origin registry. Omit to talk to the origin directly.
    #
    # dragonfly:
    #   # The Dragonfly scheduler service address with the scheme.
    #   scheduler_endpoint: http://dragonfly-scheduler.dragonfly-system.svc:8002
    #
    #   # Timeout of each attempt of a request through the seed peers, e.g.
    #   # `30s` or `1m`. Default: 30s.
    #   timeout: 30s
    #
    #   # Retries of an on-demand read on a transient failure (timeout,
    #   # connection, dfdaemon, 5xx, 408, 429), each on the next seed peer.
    #   # Default: 1, at most 3. Prefetch reads never retry.
    #   max_retries: 1
    #
    #   # Origin reads issued when the seed peers cannot serve an on-demand
    #   # read.
    #   back_to_source:
    #     # Rate limit in requests per second; 0 disables it. Default: 1.
    #     request_rate_limit: 1

storage:
  # Persistent chunk cache directory (equivalent to --cache-dir). Optional:
  # when unset (or the whole `storage` section is omitted), reads run
  # diskless — every read fetches from the backend directly and nothing is
  # written to disk. Kernel-served modes (fanotify/nbd/ublk/uffd) and
  # `nydus optimize` require a directory.
  dir: /var/lib/nydus/cache
  # Skip verifying decoded block groups against their stored checksums
  # before they are served. Default: true. Set to false to verify every
  # decoded block group when the transport is not trusted end to end.
  # skip_verify_checksums: true

prefetch:
  # Number of concurrently prefetched blobs.
  concurrent_blob_count: 10
  # Per-blob prefetch timeout, e.g. `1h`: bounds how long prefetching one
  # whole blob may take, while `http.timeout` bounds each block group request
  # within it. `0s` disables the bound. Default: 1h.
  timeout: 1h
  # Which blobs to pull: `none` disables prefetch; `ondemand` (default)
  # prefetches only the "ondemand" redirect blob, warming the access-ordered
  # hot set without pulling the whole image; `all` prefetches every blob, so
  # the entire image ends up in the local cache.
  scope: ondemand

[package]
name = "nydus-backend"
version = "3.0.0-beta.2"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Data-plane blob backends for nydus: local directory, OCI registry, and proxied reads, plus the blob prefetch that drives them. All APIs return io::Result so the OS errno survives to the service edges."
repository = "https://github.com/dragonflyoss/nydus"
readme = "README.md"

[features]
default = []
# Container image registry backend (OCI distribution).
registry = [
  "dep:serde",
  "dep:serde_json",
  "dep:reqwest",
  "dep:reqwest-middleware",
  "dep:reqwest-retry",
  "dep:url",
  "dep:async-trait",
  "dep:bytes",
  "dep:futures",
  "dep:http",
  "dep:http-auth",
  "dep:leaky-bucket",
  "dep:lru",
  "dep:tokio",
  "dep:tokio-util",
]
# Dragonfly P2P reads for the registry backend.
dragonfly = [
  "registry",
  "dep:dragonfly-api",
  "dep:dragonfly-client-request",
]

[dependencies]
async-trait = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
dragonfly-api = { version = "2.3", optional = true }
dragonfly-client-request = { version = "=1.7.2", optional = true }
futures = { version = "0.3", optional = true }
hex = { workspace = true }
http = { version = "1", optional = true }
http-auth = { version = "0.1", default-features = false, optional = true }
leaky-bucket = { version = "1", optional = true }
libc = { workspace = true }
lru = { version = "0.18", optional = true }
nydus-config = { version = "3.0.0-beta.2", path = "../nydus-config" }
nydus-format = { version = "3.0.0-beta.2", path = "../nydus-format" }
nydus-telemetry = { version = "3.0.0-beta.2", path = "../nydus-telemetry" }
reqwest = { version = "0.12", default-features = false, features = [
  "hickory-dns",
  "rustls-tls",
  "stream",
], optional = true }
reqwest-middleware = { version = "0.4", optional = true }
reqwest-retry = { version = "0.8", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = [
  "io-util",
  "rt",
  "rt-multi-thread",
  "sync",
], optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
tracing = { workspace = true }
url = { version = "2", optional = true }

[dev-dependencies]
nydus-test-utils = { path = "../nydus-test-utils" }
serde_yaml = "0.9"
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

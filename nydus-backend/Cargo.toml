[package]
name = "nydus-backend"
version = "3.0.0-alpha.1"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Data-plane blob backends for nydus: local directory, OCI registry, and proxied reads. All APIs return io::Result so the OS errno survives to the service edges."
repository = "https://github.com/dragonflyoss/nydus"
readme = "README.md"

[features]
default = []
# Container image registry backend (OCI distribution).
backend-registry = [
  "dep:serde",
  "dep:serde_json",
  "dep:thiserror",
  "dep:tracing",
  "dep:reqwest",
  "dep:reqwest-middleware",
  "dep:reqwest-retry",
  "dep:url",
  "dep:arc-swap",
  "dep:async-trait",
  "dep:futures",
  "dep:http",
  "dep:leaky-bucket",
  "dep:lru",
  "dep:tokio",
  "dep:tokio-util",
]
# Dragonfly P2P reads for the registry backend.
backend-dragonfly = [
  "backend-registry",
  "dep:dragonfly-client-request",
  "dep:bytes",
]

[dependencies]
arc-swap = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
dragonfly-client-request = { version = "=1.7.2", optional = true }
futures = { version = "0.3", optional = true }
http = { version = "1", optional = true }
leaky-bucket = { version = "1", optional = true }
lru = { version = "0.18", optional = true }
nydus-config = { version = "3.0.0-alpha.1", path = "../nydus-config" }
nydus-format = { version = "3.0.0-alpha.1", path = "../nydus-format" }
nydus-telemetry = { version = "3.0.0-alpha.1", path = "../nydus-telemetry" }
reqwest = { version = "0.12", default-features = false, features = [
  "hickory-dns",
  "rustls-tls",
  "stream",
], optional = true }
reqwest-middleware = { version = "0.4", optional = true }
reqwest-retry = { version = "0.8", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = [
  "io-util",
  "rt",
  "rt-multi-thread",
], optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
tracing = { workspace = true, optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
blake3 = "1"
crc32c = "0.6"
serde_yaml = "0.9"
tempfile = { workspace = true }

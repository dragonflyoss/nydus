# Merge into a /etc/containerd/config.toml of version = 3, containerd 2.x's
# own format, then restart containerd. The installer never edits containerd's
# config.

# The proxy snapshotter served by nydus-snapshotter-v3.service through its socket.
[proxy_plugins.nydus]
  type = "snapshot"
  address = "/run/nydus-snapshotter/nydus-snapshotter.sock"
  # root lets CRI ImageFsInfo and kubelet imagefs eviction find the
  # snapshotter's filesystem; the annotations flag makes the unpacker pass
  # layer annotations to a proxy snapshotter.
  [proxy_plugins.nydus.exports]
    root = "/var/lib/nydus-snapshotter"
    enable_remote_snapshot_annotations = "true"

[plugins."io.containerd.cri.v1.images"]
  snapshotter = "nydus"
  disable_snapshot_annotations = false   # also forces local pull on Linux

# Merge into /etc/containerd/config.toml (version = 3) on containerd 2.x, then
# restart containerd. The installer never edits containerd's config.

# The proxy snapshotter served by nydus-snapshotter.service through its socket.
[proxy_plugins.nydus]
  type = "snapshot"
  address = "/run/containerd-nydus-v3/containerd-nydus-grpc.sock"
  # root lets CRI ImageFsInfo and kubelet imagefs eviction find the
  # snapshotter's filesystem; the annotations flag makes the unpacker pass
  # layer annotations to a proxy snapshotter.
  [proxy_plugins.nydus.exports]
    root = "/var/lib/containerd-nydus-v3"
    enable_remote_snapshot_annotations = "true"

[plugins."io.containerd.cri.v1.images"]
  snapshotter = "nydus"
  disable_snapshot_annotations = false   # also forces local pull on Linux

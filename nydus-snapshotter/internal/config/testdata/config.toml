version = 1
root = "/var/lib/containerd-nydus-v3"
address = "/run/containerd-nydus-v3/containerd-nydus-grpc.sock"

[log]
level = "debug"

[metrics]
address = "127.0.0.1:4010"

[registry]
config_path = "/etc/nydus-v3/certs.d"

[auth.docker_config]
path = ""

[auth.kubesecret]
enable = true
kubeconfig = "/run/containerd-nydus-v3/kubernetes/kubeconfig"
label_selector = "app=cr-credential"

[nydusd]
driver = "fuse"
binary = "/opt/nydus-v3/bin/current/nydus"
template = "/etc/nydus-v3/nydusd.template.yaml"
log_dir = "/var/log/nydus-v3/nydusd"
mount_timeout = "20s"
prefetch_scope = "ondemand"

[nydusd.dragonfly]
scheduler_endpoint = "http://dragonfly-scheduler.dragonfly-system.svc:8002"
request_timeout = "5s"
max_retries = 1
fallback_rate_limit = 1

[cgroup]
slice = "system-nydus-v3.slice"
memory_max = "8GiB"
memory_high = "6GiB"
cpu_quota = "400%"

[cgroup.daemon]
memory_high = "1GiB"
cpu_quota = "100%"

[gc]
interval = "15m"

[gc.policy]
blob_ttl = "720h"
disk_threshold = "0"
disk_high_threshold_percent = 80
disk_low_threshold_percent = 60

root_dir: /var/lib/nydus-snapshotter
runtime_dir: /run/nydus-snapshotter
grpc:
  addr: /run/nydus-snapshotter/nydus-snapshotter.sock
log:
  level: debug
metrics:
  addr: 127.0.0.1:4010
registry:
  config_path: /etc/nydus-snapshotter/certs.d
auth:
  docker_config:
    path: ''
  kube_secret:
    enable: true
    kubeconfig: /run/nydus-snapshotter/kubernetes/kubeconfig
    label_selector: app=cr-credential
nydusd:
  driver: fuse
  binary: /opt/nydus-snapshotter/bin/current/nydus
  log:
    level: debug
  mount_timeout: 20s
  watchdog_timeout: 1m
  config:
    runtime_dir: /run/nydus-other
    backend:
      config:
        http:
          request_timeout: 2m
          request_read_timeout: 10s
          max_retries: 5
          proxy:
            addr: http://127.0.0.1:65001
        dragonfly:
          scheduler_endpoint: http://dragonfly-scheduler.dragonfly-system.svc:8002
          request_timeout: 30s
          request_read_timeout: 5s
          max_retries: 1
        fallback:
          request_timeout: 45s
          request_read_timeout: 4s
          max_retries: 2
          rate_limit: 2
    storage:
      dir: /data/nydus-cache
      skip_verify_checksums: true
      fetch_size: 4194304
    prefetch:
      concurrent_blob_count: 4
      request_timeout: 2h
      retry_interval: 3h
      scope: ondemand
cgroup:
  slice: system-nydusd.slice
  memory_max: 8GiB
  memory_high: 6GiB
  cpu_quota: 400%
  daemon:
    memory_high: 1GiB
    cpu_quota: 100%
gc:
  interval: 15m
  policy:
    blob_ttl: 720h
    disk_threshold: '0'
    disk_high_threshold_percent: 80
    disk_low_threshold_percent: 60

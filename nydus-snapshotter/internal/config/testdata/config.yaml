version: 1
root: /var/lib/nydus-snapshotter
address: /run/nydus-snapshotter/nydus-snapshotter.sock
log:
  level: debug
metrics:
  address: 127.0.0.1:4010
registry:
  config_path: /etc/nydus-snapshotter/certs.d
auth:
  docker_config:
    path: ''
  kube_secret:
    enable: true
    kubeconfig: /run/nydus-snapshotter/kubernetes/kubeconfig
    label_selector: app=cr-credential
nydusd:
  driver: fuse
  binary: /opt/nydus-snapshotter/bin/current/nydus
  template: /etc/nydus-snapshotter/nydusd.template.yaml
  log_dir: /var/log/nydus-snapshotter/nydusd
  log_level: debug
  log_max_files: 3
  mount_timeout: 20s
  watchdog_timeout: 1m
  prefetch_scope: ondemand
  dragonfly:
    scheduler_endpoint: http://dragonfly-scheduler.dragonfly-system.svc:8002
    request_timeout: 5s
    max_retries: 1
    fallback_rate_limit: 1
cgroup:
  slice: system-nydusd.slice
  memory_max: 8GiB
  memory_high: 6GiB
  cpu_quota: 400%
  daemon:
    memory_high: 1GiB
    cpu_quota: 100%
gc:
  interval: 15m
  policy:
    blob_ttl: 720h
    disk_threshold: '0'
    disk_high_threshold_percent: 80
    disk_low_threshold_percent: 60

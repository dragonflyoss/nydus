[package]
name = "nydus-storage"
version = "3.0.0-beta.3"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Local data plane for nydus images: sparse blob caches, chunk group-level fill tracking, background prefetch and on-demand access tracing. All APIs return io::Result so the OS errno survives to the service edges."
repository = "https://github.com/dragonflyoss/nydus"
readme = "README.md"

[dependencies]
hex = { workspace = true }
libc = { workspace = true }
memmap2 = { workspace = true }
nydus-backend = { version = "3.0.0-beta.3", path = "../nydus-backend" }
nydus-config = { version = "3.0.0-beta.3", path = "../nydus-config" }
nydus-format = { version = "3.0.0-beta.3", path = "../nydus-format" }
nydus-telemetry = { version = "3.0.0-beta.3", path = "../nydus-telemetry" }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
nydus-test-utils = { path = "../nydus-test-utils" }
sha2 = { workspace = true }
